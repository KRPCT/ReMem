<svg width="860" height="220" viewBox="0 0 860 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ReMem - spaced repetition Markdown flashcards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="860" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#14171d"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6fb6a8"/>
      <stop offset="1" stop-color="#3b8774"/>
    </linearGradient>
  </defs>

  <rect width="860" height="220" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="859" height="219" rx="17.5" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- flashcard motif -->
  <g>
    <rect x="612" y="58" width="150" height="104" rx="12" fill="#6fb6a8" fill-opacity="0.06" stroke="#6fb6a8" stroke-opacity="0.22"/>
    <rect x="636" y="44" width="150" height="104" rx="12" fill="#6fb6a8" fill-opacity="0.10" stroke="#6fb6a8" stroke-opacity="0.32"/>
    <rect x="660" y="30" width="150" height="104" rx="12" fill="#0a0c10" stroke="#6fb6a8" stroke-opacity="0.55"/>
    <line x1="680" y1="58" x2="790" y2="58" stroke="#6fb6a8" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <line x1="680" y1="78" x2="770" y2="78" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
    <line x1="680" y1="96" x2="782" y2="96" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round"/>
    <line x1="680" y1="114" x2="752" y2="114" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- accent bar -->
  <rect x="60" y="66" width="5" height="88" rx="2.5" fill="url(#sage)"/>

  <!-- wordmark -->
  <text x="86" y="106" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#f5f5f7" letter-spacing="-1.5">ReMem</text>

  <!-- mono caption -->
  <text x="89" y="138" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#6fb6a8" letter-spacing="3.5">SPACED REPETITION · MARKDOWN FLASHCARDS</text>

  <!-- pill tag -->
  <rect x="89" y="154" width="150" height="26" rx="13" fill="#6fb6a8" fill-opacity="0.12" stroke="#6fb6a8" stroke-opacity="0.4"/>
  <text x="164" y="171" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="11" fill="#8fcabd" letter-spacing="1">FSRS-DERIVED · PWA</text>
</svg>
